<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Igreja</title>

<style>
body{
margin:0;
height:100vh;
font-family:'Segoe UI', Arial, sans-serif;
color:white;
overflow:hidden;

/* FUNDO */
background-image:url("./fundo.png");
background-size:cover;
background-position:center;
}

/* CAMADA ESCURA */
#overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.75);
}

/* CONTEÚDO FULL */
#conteudo{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

padding:20px;
box-sizing:border-box;
text-align:center;
}

/* TEXTOS */
#titulo{
font-size:32px;
font-weight:600;
}

#igreja{
font-size:16px;
opacity:0.9;
margin-bottom:20px;
}

#relogio{
font-size:70px;
font-weight:bold;
margin:15px 0;
}

#contador{
font-size:28px;
color:#ffd700;
margin-bottom:20px;
}

#versiculo{
font-size:16px;
font-style:italic;
max-width:90%;
line-height:1.5;
margin-bottom:20px;
}

/* AVISO */
#aviso{
font-size:14px;
opacity:0.7;
margin-bottom:10px;
}

/* VOLUME */
#volume{
width:80%;
max-width:300px;
}
</style>
</head>

<body>

<div id="overlay"></div>

<audio id="audioFundo" loop preload="auto">
  <source src="Santo.mp3" type="audio/mpeg">
</audio>

<div id="conteudo">

<div id="titulo">Santa Ceia do Senhor</div>

<div id="igreja">
Igreja Batista da Renovação Espiritual<br>
Juruti - PA
</div>

<div id="relogio">00:00:00</div>

<div id="contador"></div>

<div id="versiculo"></div>

<div id="aviso">Toque na tela para iniciar o louvor</div>

<input id="volume" type="range" min="0" max="1" step="0.01" value="0.3">

</div>

<script>
const audio = document.getElementById("audioFundo");
const volume = document.getElementById("volume");
let iniciou = false;

/* INICIAR ÁUDIO */
document.addEventListener("click", function(){
if(!iniciou){
iniciou = true;
audio.volume = volume.value;
audio.play();
document.getElementById("aviso").style.display = "none";
}
});

/* VOLUME */
volume.oninput = function(){
audio.volume = volume.value;
};

/* RELÓGIO */
function relogio(){
const agora = new Date();
document.getElementById("relogio").innerText =
agora.toLocaleTimeString();
}

/* PRÓXIMO CULTO */
function proximoCulto(){
const agora = new Date();
const alvo = new Date(agora);

let dias = (7 - agora.getDay()) % 7;
alvo.setDate(agora.getDate() + dias);
alvo.setHours(19,30,0,0);

if(alvo <= agora){
alvo.setDate(alvo.getDate() + 7);
}

return alvo;
}

/* CONTAGEM */
function contagem(){
const agora = new Date();
const alvo = proximoCulto();

const diff = alvo - agora;

if(diff <= 0){
document.getElementById("contador").innerText = "O culto começou!";
return;
}

const d = Math.floor(diff / (1000*60*60*24));
const h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
const m = Math.floor((diff % (1000*60*60)) / (1000*60));
const s = Math.floor((diff % (1000*60)) / 1000);

document.getElementById("contador").innerText =
`Faltam ${d}d ${h}h ${m}m ${s}s`;
}

/* VERSÍCULOS */
const versiculos = [
"\"O Senhor é o meu pastor; nada me faltará.\" - Salmos 23:1",
"\"Tudo posso naquele que me fortalece.\" - Filipenses 4:13",
"\"Aquietai-vos e sabei que eu sou Deus.\" - Salmos 46:10",
"\"Entrega o teu caminho ao Senhor.\" - Salmos 37:5"
];

let i = 0;

function trocarVersiculo(){
document.getElementById("versiculo").innerText = versiculos[i];
i = (i + 1) % versiculos.length;
}

/* LOOP */
setInterval(relogio,1000);
setInterval(contagem,1000);
setInterval(trocarVersiculo,10000);

relogio();
contagem();
trocarVersiculo();
</script>

</body>
</html>
