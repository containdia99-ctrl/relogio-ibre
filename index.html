<!DOCTYPE html>
<html lang="pt br">
<head>
<meta charset="UTF 8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contagem Regressiva Santa Ceia</title>
</head>

<body style="margin:0; display:flex; justify-content:center; align-items:center; height:100vh; background-color:#0b0b0b; color:white; font-family:Arial,sans-serif;">

<div style="text-align:center">
<h1>Santa Ceia</h1>
<h2>Contagem Regressiva</h2>

<div id="contador" style="font-size:40px; margin-top:20px"></div>
</div>

<script>
function atualizarContagem() {
  const agora = new Date().getTime();

  const alvo = new Date();
  alvo.setDate(alvo.getDate() + ((0 + 7 - alvo.getDay()) % 7));
  alvo.setHours(19,30,0,0);

  const distancia = alvo.getTime() - agora;

  if (distancia <= 0) {
    document.getElementById("contador").innerHTML = "Já começou";
    return;
  }

  const dias = Math.floor(distancia / (1000 * 60 * 60 * 24));
  const horas = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
  const segundos = Math.floor((distancia % (1000 * 60)) / 1000);

  document.getElementById("contador").innerHTML =
    dias + " dias " + horas + " horas " + minutos + " minutos " + segundos + " segundos";
}

setInterval(atualizarContagem, 1000);
atualizarContagem();
</script>

</body>
</html>
