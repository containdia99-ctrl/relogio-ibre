<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Igreja</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<!-- iOS suporte -->
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial, sans-serif;
color:white;
text-align:center;
overflow:hidden;
touch-action:manipulation;

background-image:url("./fundo.jpg");
background-size:120%;
background-position:center;
background-repeat:no-repeat;
animation: zoomMove 25s infinite alternate ease-in-out;
}

@keyframes zoomMove{
0%{transform:scale(1); background-position:0% 50%;}
100%{transform:scale(1.1); background-position:100% 50%;}
}

#overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
z-index:0;
}

#conteudo{
position:relative;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
gap:10px;
padding:15px;
}

#titulo{font-size:28px;}
#igreja{font-size:16px;}
#relogio{font-size:48px;}
#contador{font-size:26px;}

#aviso{font-size:14px;}

#volume{width:100%;}
</style>
</head>

<body>

<div id="overlay"></div>

<audio id="audioFundo" loop preload="auto">
  <source src="Santo.mp3" type="audio/mpeg">
</audio>

<div id="conteudo">
<div id="titulo">Culto de Santa Ceia</div>
<div id="igreja">IBRE Juruti</div>
<div id="relogio"></div>
<div id="contador"></div>
<div id="aviso">Toque para iniciar</div>
<input id="volume" type="range" min="0" max="1" step="0.01" value="0.3">
</div>

<script>
const audio = document.getElementById("audioFundo");
let iniciou = false;

document.addEventListener("click", () => {
if(!iniciou){
iniciou = true;
audio.volume = 0.3;
audio.play();
document.getElementById("aviso").style.display = "none";
}
});

function relogio(){
const agora = new Date();
document.getElementById("relogio").innerText =
agora.toLocaleTimeString();
}

setInterval(relogio,1000);
relogio();

/* SERVICE WORKER */
if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
