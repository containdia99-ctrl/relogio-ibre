<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup iPhone PRO</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle at center,#222,#000);
font-family:-apple-system, BlinkMacSystemFont, sans-serif;
}

/* 📱 IPHONE */
#iphone{
width:340px;
height:700px;
border-radius:55px;
padding:12px;
background:linear-gradient(145deg,#1a1a1a,#000);
box-shadow:
0 30px 80px rgba(0,0,0,0.9),
inset 0 0 10px rgba(255,255,255,0.05);
position:relative;
}

/* BORDA METAL */
#iphone::before{
content:"";
position:absolute;
inset:0;
border-radius:55px;
padding:2px;
background:linear-gradient(145deg,#555,#111);
-webkit-mask:
linear-gradient(#fff 0 0) content-box,
linear-gradient(#fff 0 0);
-webkit-mask-composite:xor;
mask-composite:exclude;
}

/* NOTCH */
#notch{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
width:140px;
height:28px;
background:#000;
border-radius:20px;
z-index:5;
box-shadow:0 5px 10px rgba(0,0,0,0.8);
}

/* TELA */
#screen{
width:100%;
height:100%;
border-radius:45px;
overflow:hidden;
position:relative;
background:black;
}

/* STATUS BAR */
#status{
position:absolute;
top:8px;
width:100%;
display:flex;
justify-content:space-between;
padding:0 20px;
font-size:12px;
color:white;
z-index:10;
opacity:0.8;
}

/* 🔥 FUNDO */
#bg{
position:absolute;
width:100%;
height:100%;
background:url("./fundo.png") center/cover no-repeat;
animation:zoom 30s infinite alternate ease-in-out;
}

@keyframes zoom{
0%{transform:scale(1);}
100%{transform:scale(1.08);}
}

#overlay{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
}

/* CONTEÚDO */
#conteudo{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
color:white;
padding:20px;
}

/* TEXTOS */
#titulo{font-size:20px;font-weight:600;}
#igreja{font-size:12px;margin-bottom:5px;}
#endereco{font-size:11px;opacity:0.8;margin-bottom:10px;}

#relogio{
font-size:42px;
font-weight:bold;
text-shadow:0 0 10px rgba(255,255,255,0.3);
}

#contador{
font-size:16px;
color:#FFD700;
margin:10px 0;
}

#versiculo{
font-size:12px;
font-style:italic;
margin:10px;
opacity:0;
transition:0.5s;
}

#aviso{
font-size:11px;
opacity:0.6;
margin-top:10px;
}

/* SLIDER */
#volume{
width:80%;
margin-top:10px;
}

/* BARRA HOME */
#homebar{
position:absolute;
bottom:8px;
left:50%;
transform:translateX(-50%);
width:120px;
height:5px;
background:white;
border-radius:10px;
opacity:0.7;
}
</style>
</head>

<body>

<div id="iphone">

<div id="notch"></div>

<div id="screen">

<div id="status">
<span>21:50</span>
<span>🔋 📶</span>
</div>

<div id="bg"></div>
<div id="overlay"></div>

<audio id="audioFundo" loop>
<source src="santo.mp3" type="audio/mpeg">
</audio>

<div id="conteudo">

<div id="titulo">Santa Ceia do Senhor</div>
<div id="igreja">Igreja Batista da Renovação Espiritual</div>
<div id="endereco">📍 Rua Arnaldo Pinheiro - São Marcos</div>

<div id="relogio">00:00:00</div>
<div id="contador"></div>
<div id="versiculo"></div>

<div id="aviso">Toque na tela</div>

<input id="volume" type="range" min="0" max="1" step="0.01" value="0.3">

</div>

<div id="homebar"></div>

</div>
</div>

<script>
const audio = document.getElementById("audioFundo");
const volume = document.getElementById("volume");
let iniciou=false;

document.addEventListener("click", ()=>{
if(!iniciou){
iniciou=true;
audio.volume=volume.value;
audio.play().catch(()=>{});
document.getElementById("aviso").style.display="none";
}
});

volume.oninput=()=>audio.volume=volume.value;

function relogio(){
document.getElementById("relogio").innerText =
new Date().toLocaleTimeString();
}

function proximoCulto(){
const agora=new Date();
const alvo=new Date(agora);
let dias=(7-agora.getDay())%7;
alvo.setDate(agora.getDate()+dias);
alvo.setHours(19,30,0,0);

if(alvo<=agora) alvo.setDate(alvo.getDate()+7);
return alvo;
}

function contagem(){
const diff=proximoCulto()-new Date();

const d=Math.floor(diff/86400000);
const h=Math.floor((diff%86400000)/3600000);
const m=Math.floor((diff%3600000)/60000);
const s=Math.floor((diff%60000)/1000);

document.getElementById("contador").innerText =
`Faltam ${d}d ${h}h ${m}m ${s}s`;
}

const versiculos=[
"\"O Senhor é o meu pastor\" - Salmos 23:1",
"\"Tudo posso naquele que me fortalece\" - Filipenses 4:13",
"\"Aquietai-vos\" - Salmos 46:10"
];

let i=0;
function trocar(){
const el=document.getElementById("versiculo");
el.style.opacity=0;
setTimeout(()=>{
el.innerText=versiculos[i];
el.style.opacity=1;
i=(i+1)%versiculos.length;
},300);
}

setInterval(relogio,1000);
setInterval(contagem,1000);
setInterval(trocar,8000);

relogio();
contagem();
trocar();
</script>

</body>
</html>
