<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relógio</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:-apple-system, "Segoe UI", sans-serif;
color:white;
overflow:hidden;
background:black;
}

/* 🎬 FUNDO */
#bg{
position:fixed;
width:100%;
height:100%;
background:url("./fundo.png") center/cover no-repeat;
animation:movimento 40s infinite alternate ease-in-out;
filter:brightness(0.6);
}

@keyframes movimento{
0%{transform:scale(1) translate(0,0);}
100%{transform:scale(1.1) translate(-2%, -2%);}
}

/* OVERLAY */
#overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
}

/* ✨ PARTÍCULAS */
#particles{
position:fixed;
width:100%;
height:100%;
pointer-events:none;
overflow:hidden;
z-index:1;
}

.particula{
position:absolute;
width:6px;
height:6px;
background:white;
border-radius:50%;
opacity:0.6;
filter:blur(1px);
animation:subir linear infinite;
}

/* ANIMAÇÃO DAS PARTÍCULAS */
@keyframes subir{
0%{
transform:translateY(100vh) scale(0.5);
opacity:0;
}
10%{opacity:0.6;}
100%{
transform:translateY(-10vh) scale(1.2);
opacity:0;
}
}

/* RELÓGIO */
#relogio{
position:relative;
z-index:2;
font-size:22vw;
font-weight:700;
letter-spacing:2px;
text-shadow:
0 0 20px rgba(0,0,0,0.8),
0 0 40px rgba(0,0,0,0.6);
}
</style>
</head>

<body>

<div id="bg"></div>
<div id="overlay"></div>

<div id="particles"></div>

<div id="relogio">00:00</div>

<script>
/* RELÓGIO */
function atualizar(){
const agora = new Date();
const h = String(agora.getHours()).padStart(2,"0");
const m = String(agora.getMinutes()).padStart(2,"0");
document.getElementById("relogio").innerText = `${h}:${m}`;
}
setInterval(atualizar,1000);
atualizar();

/* ✨ GERAR PARTÍCULAS */
const container = document.getElementById("particles");

function criarParticula(){
const p = document.createElement("div");
p.classList.add("particula");

p.style.left = Math.random()*100 + "vw";
p.style.animationDuration = (5 + Math.random()*10) + "s";
p.style.width = p.style.height = (3 + Math.random()*6) + "px";

container.appendChild(p);

setTimeout(()=>{p.remove();},15000);
}

/* LOOP */
setInterval(criarParticula,300);
</script>

</body>
</html>
