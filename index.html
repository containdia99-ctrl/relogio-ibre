<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relógio</title>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* fundo */
.fundo {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  background-image: url('fundo.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  animation: movimento 20s infinite alternate ease-in-out;
  z-index: -3;
}

@keyframes movimento {
  0% { transform: scale(1) translate(0,0); }
  100% { transform: scale(1.05) translate(-10px,-10px); }
}

/* escurece */
.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  z-index: -2;
}

/* partículas */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
}

/* CENTRALIZAÇÃO AJUSTÁVEL */
.centro {
  position: absolute;

  /* AJUSTE AQUI PARA ALINHAR COM O LOGO */
  top: 55%;
  left: 50%;

  transform: translate(-50%, -50%);
  text-align: center;
}

/* relógio responsivo */
#relogio {
  font-size: clamp(40px, 12vw, 120px);
  color: #FFD700;
  letter-spacing: 8px;

  text-shadow:
    0 0 10px #FFD700,
    0 0 20px #FFA500,
    0 0 40px #FF8C00;
}

/* data */
#data {
  margin-top: 15px;
  font-size: clamp(14px, 4vw, 30px);
  color: #FFD700;
}
</style>

</head>
<body>

<div class="fundo"></div>
<div class="overlay"></div>
<canvas id="particulas"></canvas>

<div class="centro">
  <div id="relogio"></div>
  <div id="data"></div>
</div>

<script>
function atualizarRelogio() {
  const agora = new Date();

  let h = agora.getHours().toString().padStart(2, '0');
  let m = agora.getMinutes().toString().padStart(2, '0');
  let s = agora.getSeconds().toString().padStart(2, '0');

  document.getElementById('relogio').textContent =
    h + ":" + m + ":" + s;

  const dias = ["DOMINGO","SEGUNDA","TERÇA","QUARTA","QUINTA","SEXTA","SÁBADO"];
  let diaSemana = dias[agora.getDay()];

  let dia = agora.getDate().toString().padStart(2, '0');
  let mes = (agora.getMonth() + 1).toString().padStart(2, '0');
  let ano = agora.getFullYear();

  document.getElementById('data').textContent =
    dia + "/" + mes + "/" + ano + " | " + diaSemana;
}

setInterval(atualizarRelogio, 1000);
atualizarRelogio();

/* partículas */
const canvas = document.getElementById("particulas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particulas = [];

function criarParticula() {
  particulas.push({
    x: Math.random() * canvas.width,
    y: canvas.height,
    size: Math.random() * 4 + 1,
    speedY: Math.random() * 2 + 1,
    opacity: Math.random()
  });
}

function animar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < particulas.length; i++) {
    let p = particulas[i];

    ctx.fillStyle = "rgba(255,140,0," + p.opacity + ")";
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();

    p.y -= p.speedY;
    p.opacity -= 0.01;

    if (p.opacity <= 0) {
      particulas.splice(i, 1);
      i--;
    }
  }

  if (particulas.length < 150) {
    criarParticula();
  }

  requestAnimationFrame(animar);
}

animar();

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

</body>
</html>
