<!DOCTYPE html>
<html lang="pt br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Igreja</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-family:Arial;
text-align:center;
color:#fff;
background-image:url("fundo.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

#overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
z-index:0;
}

#conteudo{
position:relative;
z-index:1;
display:flex;
flex-direction:column;
align-items:center;
}

#titulo{
font-size:60px;
margin-bottom:20px;
}

#igreja{
font-size:28px;
margin-bottom:40px;
opacity:0.9;
}

#relogio{
font-size:90px;
margin-bottom:40px;
}

#sub{
font-size:28px;
opacity:0.8;
margin-bottom:20px;
}

#contador{
font-size:70px;
}
</style>
</head>

<body>

<div id="overlay"></div>

<audio id="audioFundo" autoplay loop>
<source src="audio.mp3" type="audio/mpeg">
</audio>

<div id="conteudo">

<div id="titulo">Culto de Santa Ceia</div>

<div id="igreja">Igreja Batista da Renovação Espiritual Juruti</div>

<div id="relogio">00:00:00</div>

<div id="sub">Contagem regressiva para domingo às 19:30</div>

<div id="contador"></div>

</div>

<script>
const audio = document.getElementById("audioFundo");

function tocarAudio(){
audio.volume = 0.3;
audio.play();
}

document.body.addEventListener("click", tocarAudio);

function relogio(){
const agora = new Date();
const h = String(agora.getHours()).padStart(2,"0");
const m = String(agora.getMinutes()).padStart(2,"0");
const s = String(agora.getSeconds()).padStart(2,"0");
document.getElementById("relogio").innerText = h+":"+m+":"+s;
}

function proximoCulto(){
const agora = new Date();
const alvo = new Date(agora);

const dias = (7 - agora.getDay()) % 7;
alvo.setDate(agora.getDate() + dias);
alvo.setHours(19,30,0,0);

if(alvo <= agora){
alvo.setDate(alvo.getDate() + 7);
}

return alvo;
}

const alvo = proximoCulto();

function contagem(){
const agora = new Date().getTime();
const distancia = alvo.getTime() - agora;

if(distancia <= 0){
document.getElementById("contador").innerText = "Já começou";
return;
}

const dias = Math.floor(distancia / (1000 * 60 * 60 * 24));
const horas = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
const minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
const segundos = Math.floor((distancia % (1000 * 60)) / 1000);

document.getElementById("contador").innerText =
dias+"d "+horas+"h "+minutos+"m "+segundos+"s";
}

setInterval(relogio,1000);
setInterval(contagem,1000);

relogio();
contagem();
</script>

</body>
</html>
