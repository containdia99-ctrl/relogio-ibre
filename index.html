<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relógio</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:-apple-system, "Segoe UI", sans-serif;
color:white;
overflow:hidden;
background:black;
}

/* 🎬 FUNDO COM MOVIMENTO */
#bg{
position:fixed;
width:100%;
height:100%;
background:url("./fundo.png") center/cover no-repeat;
animation:movimento 40s infinite alternate ease-in-out;
filter:brightness(0.6);
}

/* ANIMAÇÃO SUAVE */
@keyframes movimento{
0%{
transform:scale(1) translate(0,0);
}
100%{
transform:scale(1.1) translate(-2%, -2%);
}
}

/* OVERLAY ESCURO */
#overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
}

/* RELÓGIO */
#relogio{
position:relative;
z-index:2;
font-size:22vw;
font-weight:700;
letter-spacing:2px;
text-shadow:
0 0 20px rgba(0,0,0,0.8),
0 0 40px rgba(0,0,0,0.6);
}
</style>
</head>

<body>

<div id="bg"></div>
<div id="overlay"></div>

<div id="relogio">00:00</div>

<script>
function atualizar(){
const agora = new Date();
const h = String(agora.getHours()).padStart(2,"0");
const m = String(agora.getMinutes()).padStart(2,"0");

document.getElementById("relogio").innerText = `${h}:${m}`;
}

setInterval(atualizar,1000);
atualizar();
</script>

</body>
</html>
