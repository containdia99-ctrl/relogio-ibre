<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Igreja</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
font-family:'Segoe UI', sans-serif;
color:white;
overflow:hidden;
}

/* 🔥 FUNDO CORRIGIDO */
#bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

background-image:url("./fundo.png");
background-size:cover;
background-position:center;
background-repeat:no-repeat;

z-index:-2;
animation: zoomBg 30s infinite alternate ease-in-out;
}

@keyframes zoomBg{
0%{transform:scale(1);}
100%{transform:scale(1.08);}
}

/* OVERLAY */
#overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
z-index:-1;
}

/* CONTEÚDO */
#conteudo{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:10px;
}

/* 🔥 TEXTOS GRANDES RESPONSIVOS */
#titulo{
font-size:6vw;
font-weight:700;
}

#igreja{
font-size:3.8vw;
margin-bottom:5px;
}

#endereco{
font-size:3.2vw;
margin-bottom:15px;
opacity:0.8;
}

#relogio{
font-size:14vw;
font-weight:bold;
}

#contador{
font-size:5vw;
color:#FFD700;
margin:10px 0;
}

#versiculo{
font-size:4vw;
font-style:italic;
max-width:95%;
line-height:1.4;
margin:15px 0;
opacity:0;
transition:opacity 1s;
}

#aviso{
font-size:3.5vw;
opacity:0.6;
margin-bottom:10px;
}

#volume{
width:80%;
max-width:300px;
}
</style>
</head>

<body>

<!-- FUNDO -->
<div id="bg"></div>
<div id="overlay"></div>

<!-- ÁUDIO -->
<audio id="audioFundo" loop preload="auto">
  <source src="santo.mp3" type="audio/mpeg">
</audio>

<!-- CONTEÚDO -->
<div id="conteudo">

<div id="titulo">Santa Ceia do Senhor</div>

<div id="igreja">
Igreja Batista da Renovação Espiritual
</div>

<div id="endereco">
📍 Rua Arnaldo Pinheiro - São Marcos
</div>

<div id="relogio">00:00:00</div>

<div id="contador"></div>

<div id="versiculo"></div>

<div id="aviso">Toque na tela</div>

<input id="volume" type="range" min="0" max="1" step="0.01" value="0.3">

</div>

<script>
const audio = document.getElementById("audioFundo");
const volume = document.getElementById("volume");

let iniciou = false;

/* 🔊 INICIAR ÁUDIO */
document.addEventListener("click", function(){
if(!iniciou){
iniciou = true;
audio.volume = volume.value;
audio.play().catch(()=>{});
document.getElementById("aviso").style.display = "none";
}
});

/* VOLUME */
volume.oninput = function(){
audio.volume = volume.value;
};

/* RELÓGIO */
function relogio(){
const agora = new Date();
document.getElementById("relogio").innerText =
agora.toLocaleTimeString();
}

/* CONTAGEM */
function proximoCulto(){
const agora = new Date();
const alvo = new Date(agora);

let dias = (7 - agora.getDay()) % 7;
alvo.setDate(agora.getDate() + dias);
alvo.setHours(19,30,0,0);

if(alvo <= agora){
alvo.setDate(alvo.getDate() + 7);
}

return alvo;
}

function contagem(){
const agora = new Date();
const alvo = proximoCulto();

const diff = alvo - agora;

if(diff <= 0){
document.getElementById("contador").innerText = "O culto começou!";
return;
}

const d = Math.floor(diff / (1000*60*60*24));
const h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
const m = Math.floor((diff % (1000*60*60)) / (1000*60));
const s = Math.floor((diff % (1000*60)) / 1000);

document.getElementById("contador").innerText =
`Faltam ${d}d ${h}h ${m}m ${s}s`;
}

/* ✝️ VERSÍCULOS */
const versiculos = [
"\"O Senhor é o meu pastor; nada me faltará.\" - Salmos 23:1",
"\"Tudo posso naquele que me fortalece.\" - Filipenses 4:13",
"\"Aquietai-vos e sabei que eu sou Deus.\" - Salmos 46:10",
"\"Entrega o teu caminho ao Senhor.\" - Salmos 37:5"
];

let i = 0;
const el = document.getElementById("versiculo");

function trocarVersiculo(){
el.style.opacity = 0;

setTimeout(()=>{
el.innerText = versiculos[i];
el.style.opacity = 1;
i = (i + 1) % versiculos.length;
},500);
}

/* LOOP */
setInterval(relogio,1000);
setInterval(contagem,1000);
setInterval(trocarVersiculo,10000);

relogio();
contagem();
trocarVersiculo();
</script>

</body>
</html>
