<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<title>Relógio</title>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* fundo */
.fundo {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: url('fundo.jpg');
  background-size: cover;
  background-position: center;
  z-index: -3;
}

/* overlay */
.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  z-index: -2;
}

/* centro */
.centro {
  position: absolute;
  top: 55%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

#relogio {
  font-size: clamp(40px, 12vw, 120px);
  color: #FFD700;
}

#data {
  margin-top: 10px;
  font-size: clamp(14px, 4vw, 30px);
  color: #FFD700;
}
</style>
</head>

<body>

<div class="fundo"></div>
<div class="overlay"></div>

<div class="centro">
  <div id="relogio"></div>
  <div id="data"></div>
</div>

<script>
function atualizarRelogio() {
  const agora = new Date();

  let h = agora.getHours().toString().padStart(2, '0');
  let m = agora.getMinutes().toString().padStart(2, '0');
  let s = agora.getSeconds().toString().padStart(2, '0');

  document.getElementById('relogio').textContent =
    h + ":" + m + ":" + s;

  const dias = ["DOM","SEG","TER","QUA","QUI","SEX","SAB"];
  let diaSemana = dias[agora.getDay()];

  let dia = agora.getDate().toString().padStart(2, '0');
  let mes = (agora.getMonth()+1).toString().padStart(2, '0');

  document.getElementById('data').textContent =
    dia + "/" + mes + " | " + diaSemana;
}

setInterval(atualizarRelogio, 1000);
atualizarRelogio();

/* registrar service worker */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
