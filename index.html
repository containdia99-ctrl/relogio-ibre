<!DOCTYPE html>
<html lang="pt br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Igreja</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background-image:url("fundo.jpg");
background-size:cover;
background-position:center;
color:white;
font-family:Arial;
text-align:center;
}

#overlay{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
}

#conteudo{
position:relative;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
gap:20px;
}

#titulo{
font-size:60px;
}

#igreja{
font-size:26px;
opacity:0.9;
}

#relogio{
font-size:80px;
}

#contador{
font-size:60px;
}

#btnIniciar{
padding:15px 30px;
font-size:20px;
cursor:pointer;
border:none;
border-radius:10px;
background:#ffffff;
color:#000;
margin-top:20px;
}

#volume{
width:200px;
}
</style>
</head>

<body>

<div id="overlay"></div>

<audio id="audioFundo" loop>
<source src="audio.mp3" type="audio/mpeg">
</audio>

<div id="conteudo">

<div id="titulo">Culto de Santa Ceia</div>

<div id="igreja">Igreja Batista da Renovação Espiritual Juruti</div>

<div id="relogio">00:00:00</div>

<div id="contador"></div>

<button id="btnIniciar">Iniciar culto</button>

<input id="volume" type="range" min="0" max="1" step="0.01" value="0.3">

</div>

<script>
const audio = document.getElementById("audioFundo");
const btn = document.getElementById("btnIniciar");
const volume = document.getElementById("volume");

function fadeInAudio(){
audio.volume = 0;
audio.play();

let v = 0;
const fade = setInterval(function(){
if(v < volume.value){
v = v + 0.01;
audio.volume = v;
}else{
clearInterval(fade);
}
},50);
}

function telaCheia(){
const elem = document.documentElement;
if(elem.requestFullscreen){
elem.requestFullscreen();
}
}

btn.onclick = function(){
telaCheia();
fadeInAudio();
btn.style.display = "none";
};

volume.oninput = function(){
audio.volume = volume.value;
};

function relogio(){
const agora = new Date();
const h = String(agora.getHours()).padStart(2,"0");
const m = String(agora.getMinutes()).padStart(2,"0");
const s = String(agora.getSeconds()).padStart(2,"0");
document.getElementById("relogio").innerText = h+":"+m+":"+s;
}

function proximoCulto(){
const agora = new Date();
const alvo = new Date(agora);

const dias = (7 - agora.getDay()) % 7;
alvo.setDate(agora.getDate() + dias);
alvo.setHours(19,30,0,0);

if(alvo <= agora){
alvo.setDate(alvo.getDate() + 7);
}

return alvo;
}

const alvo = proximoCulto();

function contagem(){
const agora = new Date().getTime();
const distancia = alvo.getTime() - agora;

if(distancia <= 0){
document.getElementById("contador").innerText = "Já começou";
return;
}

const dias = Math.floor(distancia / (1000 * 60 * 60 * 24));
const horas = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
const minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
const segundos = Math.floor((distancia % (1000 * 60)) / 1000);

document.getElementById("contador").innerText =
dias+"d "+horas+"h "+minutos+"m "+segundos+"s";
}

setInterval(relogio,1000);
setInterval(contagem,1000);

relogio();
contagem();
</script>

</body>
</html>
