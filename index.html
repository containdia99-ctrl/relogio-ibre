<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Igreja</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#000;
font-family:-apple-system, 'Segoe UI', sans-serif;
overflow:hidden;
color:white;
}

/* 🎬 FUNDO CINEMÁTICO */
#bg{
position:fixed;
width:100%;
height:100%;
background:url("./fundo.png") center/cover no-repeat;
filter:brightness(0.4) saturate(1.2);
animation:zoom 40s infinite alternate ease-in-out;
}

@keyframes zoom{
0%{transform:scale(1);}
100%{transform:scale(1.1);}
}

/* VINHETA */
#bg::after{
content:"";
position:absolute;
width:100%;
height:100%;
background:radial-gradient(circle, transparent 40%, rgba(0,0,0,0.85));
}

/* CONTEÚDO */
#conteudo{
position:relative;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
gap:20px;
}

/* TÍTULOS */
#titulo{
font-size:6vw;
font-weight:600;
letter-spacing:1px;
}

#igreja{
font-size:3.5vw;
opacity:0.8;
}

#endereco{
font-size:3vw;
opacity:0.6;
}

/* LINHA */
.linha{
width:40%;
height:2px;
background:linear-gradient(to right, transparent, white, transparent);
opacity:0.3;
}

/* RELÓGIO */
#relogio{
font-size:18vw;
font-weight:700;
letter-spacing:2px;
text-shadow:0 0 20px rgba(255,255,255,0.2);
}

/* CONTADOR */
#contador{
font-size:4.5vw;
color:#FFD700;
}

/* VERSÍCULO */
#versiculo{
max-width:90%;
font-size:3.8vw;
line-height:1.5;
font-style:italic;
opacity:0.85;
transition:opacity 1s;
}

/* VOLUME */
#volume{
width:60%;
opacity:0.5;
}
</style>
</head>

<body>

<div id="bg"></div>

<audio id="audioFundo" loop>
<source src="santo.mp3" type="audio/mpeg">
</audio>

<div id="conteudo">

<div id="titulo">Santa Ceia do Senhor</div>
<div id="igreja">Igreja Batista da Renovação Espiritual</div>
<div id="endereco">Rua Arnaldo Pinheiro - São Marcos</div>

<div class="linha"></div>

<div id="relogio">00:00</div>

<div id="contador"></div>

<div class="linha"></div>

<div id="versiculo"></div>

<input id="volume" type="range" min="0" max="1" step="0.01" value="0.3">

</div>

<script>
const audio=document.getElementById("audioFundo");
const volume=document.getElementById("volume");

let iniciou=false;

document.addEventListener("click",()=>{
if(!iniciou){
iniciou=true;
audio.volume=volume.value;
audio.play().catch(()=>{});
}
});

volume.oninput=()=>audio.volume=volume.value;

/* RELÓGIO */
function relogio(){
document.getElementById("relogio").innerText=
new Date().toLocaleTimeString().slice(0,5);
}

/* CONTAGEM */
function proximoCulto(){
const agora=new Date();
const alvo=new Date(agora);
let dias=(7-agora.getDay())%7;
alvo.setDate(agora.getDate()+dias);
alvo.setHours(19,30,0,0);

if(alvo<=agora) alvo.setDate(alvo.getDate()+7);
return alvo;
}

function contagem(){
const diff=proximoCulto()-new Date();

const h=Math.floor(diff/3600000);
const m=Math.floor((diff%3600000)/60000);

document.getElementById("contador").innerText=
`Faltam ${h}h ${m}m`;
}

/* VERSÍCULOS */
const versiculos=[
"O Senhor é o meu pastor; nada me faltará. - Salmos 23:1",
"Tudo posso naquele que me fortalece. - Filipenses 4:13",
"Aquietai-vos e sabei que eu sou Deus. - Salmos 46:10"
];

let i=0;

function trocar(){
const el=document.getElementById("versiculo");
el.style.opacity=0;

setTimeout(()=>{
el.innerText=versiculos[i];
el.style.opacity=1;
i=(i+1)%versiculos.length;
},500);
}

/* LOOP */
setInterval(relogio,1000);
setInterval(contagem,1000);
setInterval(trocar,10000);

relogio();
contagem();
trocar();
</script>

</body>
</html>
