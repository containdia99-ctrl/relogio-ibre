<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Igreja</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:'Segoe UI', Arial, sans-serif;
color:white;
text-align:center;
overflow:hidden;

background-image:url("./fundo.jpg");
background-size:cover;
background-position:center;
}

/* OVERLAY */
#overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
}

/* CARD */
#conteudo{
position:relative;
z-index:2;
width:90%;
max-width:350px;
background:rgba(0,0,0,0.55);
padding:25px;
border-radius:20px;
backdrop-filter:blur(12px);
box-shadow:0 0 30px rgba(0,0,0,0.5);
}

/* TEXTOS */
#titulo{
font-size:24px;
font-weight:600;
}

#igreja{
font-size:14px;
opacity:0.85;
margin-bottom:15px;
}

#relogio{
font-size:44px;
font-weight:bold;
margin:10px 0;
}

#contador{
font-size:20px;
margin-bottom:15px;
}

#versiculo{
font-size:14px;
font-style:italic;
margin:15px 0;
opacity:0.9;
line-height:1.4;
}

/* AVISO */
#aviso{
font-size:13px;
opacity:0.7;
margin-bottom:10px;
}

/* VOLUME */
#volume{
width:100%;
}
</style>
</head>

<body>

<div id="overlay"></div>

<audio id="audioFundo" loop preload="auto">
  <source src="Santo.mp3" type="audio/mpeg">
</audio>

<div id="conteudo">

<div id="titulo">Santa Ceia do Senhor</div>

<div id="igreja">
Igreja Batista da Renovação Espiritual<br>
Juruti - PA
</div>

<div id="relogio">00:00:00</div>

<div id="contador"></div>

<div id="versiculo"></div>

<div id="aviso">Toque na tela para iniciar o louvor</div>

<input id="volume" type="range" min="0" max="1" step="0.01" value="0.3">

</div>

<script>
const audio = document.getElementById("audioFundo");
let iniciou = false;

/* INICIAR ÁUDIO */
document.addEventListener("click", function(){
if(!iniciou){
iniciou = true;
audio.volume = 0.3;
audio.play();
document.getElementById("aviso").style.display = "none";
}
});

/* RELÓGIO */
function relogio(){
const agora = new Date();
document.getElementById("relogio").innerText =
agora.toLocaleTimeString();
}

/* CONTAGEM */
function proximoCulto(){
const agora = new Date();
const alvo = new Date(agora);

let dias = (7 - agora.getDay()) % 7;
alvo.setDate(agora.getDate() + dias);
alvo.setHours(19,30,0,0);

if(alvo <= agora){
alvo.setDate(alvo.getDate() + 7);
}

return alvo;
}

function contagem(){
const agora = new Date();
const alvo = proximoCulto();

const diff = alvo - agora;

const d = Math.floor(diff / (1000*60*60*24));
const h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
const m = Math.floor((diff % (1000*60*60)) / (1000*60));
const s = Math.floor((diff % (1000*60)) / 1000);

document.getElementById("contador").innerText =
`Faltam ${d}d ${h}h ${m}m ${s}s`;
}

/* ✝️ VERSÍCULOS */
const versiculos = [
"\"O Senhor é o meu pastor; nada me faltará.\" - Salmos 23:1",
"\"Tudo posso naquele que me fortalece.\" - Filipenses 4:13",
"\"Deem graças ao Senhor, porque ele é bom.\" - Salmos 107:1",
"\"Aquietai-vos e sabei que eu sou Deus.\" - Salmos 46:10",
"\"Entrega o teu caminho ao Senhor.\" - Salmos 37:5",
"\"O choro pode durar uma noite, mas a alegria vem pela manhã.\" - Salmos 30:5",
"\"Buscai ao Senhor enquanto se pode achar.\" - Isaías 55:6"
];

let indice = 0;

function trocarVersiculo(){
document.getElementById("versiculo").innerText = versiculos[indice];
indice = (indice + 1) % versiculos.length;
}

/* LOOP */
setInterval(relogio,1000);
setInterval(contagem,1000);
setInterval(trocarVersiculo,10000); // troca a cada 10s

relogio();
contagem();
trocarVersiculo();
</script>

</body>
</html>
