<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Futuristic Clock</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
"Segoe UI",
sans-serif;
background:#000;
}

/* =========================
🎬 FUNDO FUTURISTA
========================= */

#bg{
position:fixed;
inset:0;

background:
linear-gradient(
rgba(0,0,0,.35),
rgba(0,0,0,.55)
),
url("./fundo.png") center center / cover no-repeat;

animation:bgMove 25s ease-in-out infinite alternate;

filter:
saturate(1.5)
contrast(1.1)
brightness(.7);

transform:scale(1.08);
}

@keyframes bgMove{
0%{
transform:scale(1.08) translate(0px,0px);
}
100%{
transform:scale(1.15) translate(-20px,-20px);
}
}

/* =========================
🌈 AURAS NEON
========================= */

.aura{
position:fixed;
width:700px;
height:700px;
border-radius:50%;
filter:blur(120px);
mix-blend-mode:screen;
opacity:.55;
animation:auraMove 10s ease-in-out infinite alternate;
}

.aura1{
background:#00d9ff;
top:-250px;
left:-150px;
}

.aura2{
background:#ff00e5;
bottom:-300px;
right:-150px;
animation-delay:3s;
}

.aura3{
background:#7bff00;
top:30%;
left:40%;
animation-delay:6s;
}

@keyframes auraMove{
0%{
transform:scale(1);
}
100%{
transform:scale(1.2) translateY(-20px);
}
}

/* =========================
⚡ GRID FUTURISTA
========================= */

#grid{
position:fixed;
inset:0;

background-image:
linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);

background-size:50px 50px;

mask-image:linear-gradient(to bottom, transparent, black);

opacity:.25;

transform:perspective(500px) rotateX(70deg) scale(2);

bottom:-40%;
}

/* =========================
✨ PARTÍCULAS
========================= */

#particles{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
}

.particle{
position:absolute;
border-radius:50%;
opacity:0;

animation:float linear forwards;
}

@keyframes float{

0%{
transform:translateY(100vh) scale(.2);
opacity:0;
}

10%{
opacity:1;
}

100%{
transform:translateY(-10vh) scale(1.4);
opacity:0;
}

}

/* =========================
🧊 GLASS CLOCK
========================= */

.clock-wrap{

position:relative;
z-index:5;

padding:50px 80px;

border-radius:40px;

background:
linear-gradient(
135deg,
rgba(255,255,255,.14),
rgba(255,255,255,.03)
);

backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px);

border:
1px solid rgba(255,255,255,.15);

box-shadow:
0 0 80px rgba(0,255,255,.12),
0 0 120px rgba(255,0,255,.08),
inset 0 1px 1px rgba(255,255,255,.15);

overflow:hidden;
}

/* BRILHO INTERNO */

.clock-wrap::before{
content:"";

position:absolute;
inset:0;

background:
linear-gradient(
120deg,
transparent,
rgba(255,255,255,.18),
transparent
);

transform:translateX(-100%);
animation:shine 6s linear infinite;
}

@keyframes shine{

100%{
transform:translateX(100%);
}

}

/* =========================
⏰ RELÓGIO
========================= */

#clock{

position:relative;
z-index:2;

font-size:14vw;
font-weight:700;

letter-spacing:-8px;

color:white;

text-shadow:
0 0 10px rgba(255,255,255,.9),
0 0 30px rgba(0,255,255,.8),
0 0 60px rgba(255,0,255,.5);

animation:pulse 4s ease-in-out infinite;
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.02);
}

100%{
transform:scale(1);
}

}

/* =========================
📱 MOBILE
========================= */

@media(max-width:768px){

.clock-wrap{
padding:30px 40px;
border-radius:28px;
}

#clock{
font-size:24vw;
letter-spacing:-4px;
}

}

</style>
</head>

<body>

<div id="bg"></div>

<div class="aura aura1"></div>
<div class="aura aura2"></div>
<div class="aura aura3"></div>

<div id="grid"></div>

<div id="particles"></div>

<div class="clock-wrap">
<div id="clock">00:00</div>
</div>

<script>

/* =========================
⏰ CLOCK
========================= */

function updateClock(){

const now = new Date();

const h =
String(now.getHours()).padStart(2,"0");

const m =
String(now.getMinutes()).padStart(2,"0");

document.getElementById("clock")
.innerText = `${h}:${m}`;

}

setInterval(updateClock,1000);

updateClock();

/* =========================
✨ PARTICLES
========================= */

const container =
document.getElementById("particles");

const neonColors = [
"#00ffff",
"#ff00ff",
"#7bff00",
"#00aaff",
"#ffffff"
];

function createParticle(){

const p =
document.createElement("div");

p.classList.add("particle");

const size =
Math.random()*5 + 2;

p.style.width = size + "px";
p.style.height = size + "px";

p.style.left =
Math.random()*100 + "vw";

p.style.background =
neonColors[
Math.floor(
Math.random()*neonColors.length
)
];

p.style.boxShadow =
`0 0 15px ${p.style.background}`;

p.style.animationDuration =
(Math.random()*8 + 6) + "s";

container.appendChild(p);

setTimeout(()=>{
p.remove();
},15000);

}

setInterval(createParticle,120);

</script>

</body>
</html>
