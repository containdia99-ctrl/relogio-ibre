<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Igreja</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial, sans-serif;
color:white;
text-align:center;

background-image:url("./fundo.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

#overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
z-index:0;
}

#conteudo{
position:relative;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
gap:15px;
padding:20px;
}

#titulo{
font-size:60px;
text-shadow:2px 2px 10px rgba(0,0,0,0.8);
}

#igreja{
font-size:26px;
opacity:0.9;
}

#relogio{
font-size:80px;
animation:pulse 1s infinite alternate;
text-shadow:2px 2px 10px rgba(0,0,0,0.8);
}

#contador{
font-size:50px;
text-shadow:2px 2px 10px rgba(0,0,0,0.8);
}

#aviso{
font-size:18px;
opacity:0.8;
margin-top:10px;
}

#volume{
width:200px;
}

@keyframes pulse{
from{transform:scale(1);}
to{transform:scale(1.05);}
}

@media (max-width:600px){
#titulo{font-size:30px;}
#relogio{font-size:50px;}
#contador{font-size:30px;}
}
</style>
</head>

<body>

<div id="overlay"></div>

<audio id="audioFundo" loop preload="auto">
  <source src="Santo.mp4" type="audio/mp4">
</audio>

<div id="conteudo">

<div id="titulo">Culto de Santa Ceia</div>

<div id="igreja">Igreja Batista da Renovação Espiritual Juruti</div>

<div id="relogio">00:00:00</div>

<div id="contador"></div>

<div id="aviso">Toque em qualquer lugar para iniciar o som</div>

<input id="volume" type="range" min="0" max="1" step="0.01" value="0.3">

</div>

<script>
const audio = document.getElementById("audioFundo");
const volume = document.getElementById("volume");
let iniciado = false;

/* FULLSCREEN */
function telaCheia(){
if(document.documentElement.requestFullscreen){
document.documentElement.requestFullscreen();
}
}

/* FADE IN */
function fadeIn(){
audio.volume = 0;

audio.play().then(() => {
  let v = 0;
  let alvo = volume.value;

  let fade = setInterval(function(){
    if(v < alvo){
      v += 0.005;
      audio.volume = Math.min(v, alvo);
    }else{
      clearInterval(fade);
    }
  },50);
}).catch(() => {
  console.log("Autoplay bloqueado");
});
}

/* INICIAR COM QUALQUER CLIQUE */
function iniciar(){
if(!iniciado){
iniciado = true;
telaCheia();
fadeIn();
document.getElementById("aviso").style.display = "none";
}
}

document.addEventListener("click", iniciar);

/* VOLUME */
volume.oninput = function(){
audio.volume = volume.value;
};

/* RELÓGIO */
function relogio(){
const agora = new Date();
const h = String(agora.getHours()).padStart(2,"0");
const m = String(agora.getMinutes()).padStart(2,"0");
const s = String(agora.getSeconds()).padStart(2,"0");
document.getElementById("relogio").innerText = h+":"+m+":"+s;
}

/* PRÓXIMO DOMINGO 19:30 */
function proximoCulto(){
const agora = new Date();
const alvo = new Date(agora);

let dias = (7 - agora.getDay()) % 7;
alvo.setDate(agora.getDate() + dias);
alvo.setHours(19,30,0,0);

if(alvo <= agora){
alvo.setDate(alvo.getDate() + 7);
}

return alvo;
}

/* CONTAGEM */
function contagem(){
const agora = new Date();
const alvo = proximoCulto();

const distancia = alvo.getTime() - agora.getTime();

if(distancia <= 0){
document.getElementById("contador").innerText = "Já começou";
return;
}

const dias = Math.floor(distancia / (1000*60*60*24));
const horas = Math.floor((distancia % (1000*60*60*24)) / (1000*60*60));
const minutos = Math.floor((distancia % (1000*60*60)) / (1000*60));
const segundos = Math.floor((distancia % (1000*60)) / 1000);

document.getElementById("contador").innerText =
dias+"d "+horas+"h "+minutos+"m "+segundos+"s";
}

/* LOOP */
setInterval(relogio,1000);
setInterval(contagem,1000);

relogio();
contagem();
</script>

</body>
</html>
