<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone Real Size</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle,#111,#000);
font-family:-apple-system, sans-serif;
}

/* FUNDO CINEMÁTICO */
body::before{
content:"";
position:absolute;
width:120%;
height:120%;
background:url("./fundo.png") center/cover no-repeat;
filter:blur(40px) brightness(0.5);
z-index:-1;
}

/* 📱 IPHONE TAMANHO REAL */
#iphone{
width:73.6mm;
height:158.9mm;

border-radius:18mm;
padding:3mm;

background:linear-gradient(145deg,#111,#000);

box-shadow:
0 25px 70px rgba(0,0,0,0.9),
inset 0 0 5px rgba(255,255,255,0.05);

transform-style:preserve-3d;
animation:rotatePhone 6s infinite alternate ease-in-out;

position:relative;
}

/* ANIMAÇÃO */
@keyframes rotatePhone{
0%{transform:rotateY(-5deg) rotateX(2deg);}
100%{transform:rotateY(5deg) rotateX(-2deg);}
}

/* NOTCH */
#notch{
position:absolute;
top:3mm;
left:50%;
transform:translateX(-50%);
width:30mm;
height:6mm;
background:#000;
border-radius:10mm;
z-index:5;
}

/* TELA */
#screen{
width:100%;
height:100%;
border-radius:15mm;
overflow:hidden;
position:relative;
background:black;
}

/* REFLEXO */
#glass{
position:absolute;
width:100%;
height:100%;
background:linear-gradient(
120deg,
rgba(255,255,255,0.2),
transparent
);
pointer-events:none;
}

/* FUNDO APP */
#bg{
position:absolute;
width:100%;
height:100%;
background:url("./fundo.png") center/cover no-repeat;
animation:zoom 30s infinite alternate;
}

@keyframes zoom{
0%{transform:scale(1);}
100%{transform:scale(1.08);}
}

#overlay{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
}

/* CONTEÚDO */
#conteudo{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
color:white;
padding:10px;
}

/* TEXTOS */
#titulo{font-size:5mm;font-weight:600;}
#igreja{font-size:3mm;}
#endereco{font-size:2.8mm;margin-bottom:3mm;opacity:0.8;}

#relogio{
font-size:10mm;
font-weight:bold;
}

#contador{
font-size:4mm;
color:#FFD700;
margin:2mm 0;
}

#versiculo{
font-size:3mm;
font-style:italic;
margin:2mm;
opacity:0;
transition:0.5s;
}

/* VOLUME */
#volume{
width:80%;
margin-top:3mm;
}

/* BARRA */
#homebar{
position:absolute;
bottom:3mm;
left:50%;
transform:translateX(-50%);
width:35mm;
height:1.5mm;
background:white;
border-radius:10mm;
opacity:0.7;
}
</style>
</head>

<body>

<div id="iphone">

<div id="notch"></div>

<div id="screen">

<div id="bg"></div>
<div id="overlay"></div>

<audio id="audioFundo" loop>
<source src="santo.mp3" type="audio/mpeg">
</audio>

<div id="conteudo">

<div id="titulo">Santa Ceia do Senhor</div>
<div id="igreja">Igreja Batista da Renovação Espiritual</div>
<div id="endereco">📍 Rua Arnaldo Pinheiro - São Marcos</div>

<div id="relogio">00:00:00</div>
<div id="contador"></div>
<div id="versiculo"></div>

<input id="volume" type="range" min="0" max="1" step="0.01" value="0.3">

</div>

<div id="glass"></div>
<div id="homebar"></div>

</div>
</div>

<script>
const audio=document.getElementById("audioFundo");
const volume=document.getElementById("volume");

let iniciou=false;

document.addEventListener("click",()=>{
if(!iniciou){
iniciou=true;
audio.volume=volume.value;
audio.play().catch(()=>{});
}
});

volume.oninput=()=>audio.volume=volume.value;

/* RELÓGIO */
function relogio(){
document.getElementById("relogio").innerText=
new Date().toLocaleTimeString();
}

/* CONTAGEM */
function proximoCulto(){
const agora=new Date();
const alvo=new Date(agora);
let dias=(7-agora.getDay())%7;
alvo.setDate(agora.getDate()+dias);
alvo.setHours(19,30,0,0);

if(alvo<=agora) alvo.setDate(alvo.getDate()+7);
return alvo;
}

function contagem(){
const diff=proximoCulto()-new Date();

const d=Math.floor(diff/86400000);
const h=Math.floor((diff%86400000)/3600000);
const m=Math.floor((diff%3600000)/60000);
const s=Math.floor((diff%60000)/1000);

document.getElementById("contador").innerText=
`Faltam ${d}d ${h}h ${m}m ${s}s`;
}

/* VERSÍCULOS */
const versiculos=[
"\"O Senhor é o meu pastor\" - Salmos 23:1",
"\"Tudo posso naquele que me fortalece\" - Filipenses 4:13",
"\"Aquietai-vos\" - Salmos 46:10"
];

let i=0;
function trocar(){
const el=document.getElementById("versiculo");
el.style.opacity=0;

setTimeout(()=>{
el.innerText=versiculos[i];
el.style.opacity=1;
i=(i+1)%versiculos.length;
},300);
}

/* LOOP */
setInterval(relogio,1000);
setInterval(contagem,1000);
setInterval(trocar,8000);

relogio();
contagem();
trocar();
</script>

</body>
</html>
