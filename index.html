<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Igreja</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#000;
font-family:-apple-system, 'Segoe UI', sans-serif;
overflow:hidden;
color:white;
}

/* FUNDO */
body::before{
content:"";
position:absolute;
width:120%;
height:120%;
background:url("./fundo.png") center/cover no-repeat;
filter:blur(40px) brightness(0.4);
z-index:-1;
}

/* CENA */
#scene{
perspective:1400px;
}

/* 📱 IPHONE */
#iphone{
width:95vw;
max-width:420px;
aspect-ratio:9/19.5;

border-radius:50px;
padding:12px;

background:linear-gradient(145deg,#111,#000);

box-shadow:
0 40px 120px rgba(0,0,0,0.9),
inset 0 0 10px rgba(255,255,255,0.05);

transform-style:preserve-3d;
animation:rotatePhone 6s infinite alternate ease-in-out;
position:relative;
}

/* ROTAÇÃO */
@keyframes rotatePhone{
0%{transform:rotateY(-6deg) rotateX(3deg);}
100%{transform:rotateY(6deg) rotateX(-3deg);}
}

/* NOTCH */
#notch{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
width:120px;
height:25px;
background:#000;
border-radius:20px;
z-index:5;
}

/* TELA */
#screen{
width:100%;
height:100%;
border-radius:40px;
overflow:hidden;
position:relative;
background:black;
}

/* FUNDO INTERNO */
#bg{
position:absolute;
width:100%;
height:100%;
background:url("./fundo.png") center/cover no-repeat;
filter:brightness(0.4);
animation:zoom 30s infinite alternate;
}

@keyframes zoom{
0%{transform:scale(1);}
100%{transform:scale(1.08);}
}

/* VINHETA */
#overlay{
position:absolute;
width:100%;
height:100%;
background:radial-gradient(circle, transparent 40%, rgba(0,0,0,0.85));
}

/* 💎 VIDRO PRINCIPAL */
#glass{
position:absolute;
width:100%;
height:100%;
pointer-events:none;

background:
linear-gradient(120deg,
rgba(255,255,255,0.25) 0%,
rgba(255,255,255,0.08) 20%,
transparent 40%),
linear-gradient(300deg,
rgba(255,255,255,0.12),
transparent 60%);

mix-blend-mode:screen;
animation:glassMove 6s infinite alternate ease-in-out;
}

/* ✨ SEGUNDA CAMADA */
#glass2{
position:absolute;
width:100%;
height:100%;
background:linear-gradient(
180deg,
rgba(255,255,255,0.15),
transparent 30%,
transparent 70%,
rgba(255,255,255,0.1)
);
opacity:0.5;
pointer-events:none;
}

/* ANIMAÇÃO VIDRO */
@keyframes glassMove{
0%{
transform:translateX(-10%) translateY(-5%) rotate(0deg);
opacity:0.7;
}
100%{
transform:translateX(10%) translateY(5%) rotate(2deg);
opacity:1;
}
}

/* CONTEÚDO */
#conteudo{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
gap:15px;
}

/* TEXTOS */
#titulo{font-size:22px;font-weight:600;}
#igreja{font-size:14px;opacity:0.8;}
#endereco{font-size:12px;opacity:0.6;}

.linha{
width:40%;
height:2px;
background:linear-gradient(to right, transparent, white, transparent);
opacity:0.3;
}

#relogio{
font-size:48px;
font-weight:bold;
}

#contador{
font-size:16px;
color:#FFD700;
}

#versiculo{
font-size:13px;
font-style:italic;
opacity:0.9;
}

/* HOME BAR */
#homebar{
position:absolute;
bottom:10px;
left:50%;
transform:translateX(-50%);
width:120px;
height:5px;
background:white;
border-radius:10px;
opacity:0.7;
}

/* VOLUME */
#volume{
width:80%;
opacity:0.6;
}
</style>
</head>

<body>

<div id="scene">

<div id="iphone">

<div id="notch"></div>

<div id="screen">

<div id="bg"></div>
<div id="overlay"></div>

<!-- 💎 VIDRO -->
<div id="glass"></div>
<div id="glass2"></div>

<audio id="audioFundo" loop>
<source src="santo.mp3" type="audio/mpeg">
</audio>

<div id="conteudo">

<div id="titulo">Santa Ceia do Senhor</div>
<div id="igreja">Igreja Batista da Renovação Espiritual</div>
<div id="endereco">Rua Arnaldo Pinheiro - São Marcos</div>

<div class="linha"></div>

<div id="relogio">00:00</div>
<div id="contador"></div>

<div class="linha"></div>

<div id="versiculo"></div>

<input id="volume" type="range" min="0" max="1" step="0.01" value="0.3">

</div>

<div id="homebar"></div>

</div>
</div>

</div>

<script>
const audio=document.getElementById("audioFundo");
const volume=document.getElementById("volume");

let iniciou=false;

document.addEventListener("click",()=>{
if(!iniciou){
iniciou=true;
audio.volume=volume.value;
audio.play().catch(()=>{});
}
});

volume.oninput=()=>audio.volume=volume.value;

/* RELÓGIO */
function relogio(){
document.getElementById("relogio").innerText=
new Date().toLocaleTimeString().slice(0,5);
}

/* CONTAGEM */
function proximoCulto(){
const agora=new Date();
const alvo=new Date(agora);
let dias=(7-agora.getDay())%7;
alvo.setDate(agora.getDate()+dias);
alvo.setHours(19,30,0,0);

if(alvo<=agora) alvo.setDate(alvo.getDate()+7);
return alvo;
}

function contagem(){
const diff=proximoCulto()-new Date();

const h=Math.floor(diff/3600000);
const m=Math.floor((diff%3600000)/60000);

document.getElementById("contador").innerText=
`Faltam ${h}h ${m}m`;
}

/* VERSÍCULOS */
const versiculos=[
"O Senhor é o meu pastor; nada me faltará. - Salmos 23:1",
"Tudo posso naquele que me fortalece. - Filipenses 4:13",
"Aquietai-vos e sabei que eu sou Deus. - Salmos 46:10"
];

let i=0;

function trocar(){
const el=document.getElementById("versiculo");
el.style.opacity=0;

setTimeout(()=>{
el.innerText=versiculos[i];
el.style.opacity=1;
i=(i+1)%versiculos.length;
},500);
}

setInterval(relogio,1000);
setInterval(contagem,1000);
setInterval(trocar,10000);

relogio();
contagem();
trocar();
</script>

</body>
</html>
